# Paper-aligned benchmark (Buesser & Kurmus, QCE 2026): seven intent classes, ten Table II features,
# FakeNighthawk, optimization levels 0-3, 24 and 48 qubits. Generators/feature conventions are OUR interpretation.
backend: FakeNighthawk
transpile_seed: 11
sizes: [24, 48]
opt_levels: [0, 1, 2, 3]
variants: 6              # distinct source circuits per generator (47 generators -> 282 sources)
test_variants: 2         # per generator, held out as the source-disjoint test split
n_splits: 5              # repeated random source-disjoint splits (mean +- std reported)
cv_folds: 5
rf_grid: {n_estimators: [100, 300], max_depth: [null, 20], min_samples_leaf: [1, 2]}
seed: 7
profiles:
  smoke: {sizes: [24], opt_levels: [0, 2], variants: 3, test_variants: 1, n_splits: 2, rf_grid: {n_estimators: [50], max_depth: [null], min_samples_leaf: [1]},
            defense: {n_qubits: 24, opt_levels: [0, 2], strategies: [layout, decomp, reorder, decomp+layout], budgets: [0.0, 0.2], qcec_timeout_s: 20, rf_grid: {n_estimators: [50], max_depth: [null], min_samples_leaf: [1]}}}
  quick: {sizes: [24, 48], opt_levels: [0, 2, 3], variants: 4, test_variants: 1, n_splits: 3}
defense:
  n_qubits: 24                 # exact logical-equivalence checking (MQT QCEC) was feasible here; 48 qubits not attempted
  opt_levels: [0, 2, 3]
  strategies: [layout, decomp, reorder, decomp+reorder, decomp+layout, reorder+layout]   # one candidate per strategy
  budgets: [0.0, 0.1, 0.2, 0.5]    # max relative increase of depth / 2Q gates / active qubits
  qcec_timeout_s: 30
  rf_grid: {n_estimators: [200], max_depth: [null, 20], min_samples_leaf: [1, 2]}
